
name: Build POS Cimol APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari GitHub
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Siapkan Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Siapkan Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 4. Periksa Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      # 5. Download Gradle 8.9
      - name: Setup Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      # 6. Periksa konfigurasi
      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version

      # 7. Build APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug

      # 8. Periksa hasil APK
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 9. Simpan APK sebagai artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-Cimol-V5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
